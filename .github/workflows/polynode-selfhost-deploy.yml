# Polynode's self-hosted OpenSEO (open-seo-selfhost.iker-gonzalez.workers.dev).
#
# This fork exists only to hold this workflow. Each run deploys the latest
# tagged upstream release of every-app/open-seo, never this fork's main, so
# upstream changes to .github/ never need syncing and a broken commit on
# upstream main is never what ships. The deploy type-checks before it touches
# Cloudflare, and Alchemy keeps its state in the Cloudflare account, so a run
# that fails leaves the live Worker as it was.
#
# Secrets:
#   CLOUDFLARE_API_TOKEN   edit on Workers Scripts, Workers KV, R2, D1, Access: Apps and
#                          Policies, and Access: Organizations, Identity Providers, and Groups
#   CLOUDFLARE_ACCOUNT_ID
#   ENV_SELFHOST           the full contents of .env.selfhost
name: Deploy self-hosted OpenSEO

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream tag or branch to deploy (default the latest release)
        required: false

concurrency:
  group: selfhost-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve the upstream release
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          ref="${INPUT_REF:-$(gh release view -R every-app/open-seo --json tagName -q .tagName)}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Deploying every-app/open-seo@$ref" >> "$GITHUB_STEP_SUMMARY"

      # Alchemy reports a refused Cloudflare call as a bare "Transport error",
      # so check the token and account first and print what Cloudflare said.
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          check() {
            code=$(curl -s -o /tmp/cf.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/$1")
            echo "$1 -> HTTP $code $(jq -c '[.errors[]?|{code,message}]' /tmp/cf.json)"
            [ "$code" = 200 ]
          }
          ok=0
          check user/tokens/verify || ok=1
          check "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" || ok=1
          check "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" || ok=1
          check "accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets" || ok=1
          check "accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" || ok=1
          check "accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" || ok=1
          check "accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps" || ok=1
          check "accounts/$CLOUDFLARE_ACCOUNT_ID/access/organizations" || ok=1
          exit $ok

      - uses: actions/checkout@v4
        with:
          repository: every-app/open-seo
          ref: ${{ steps.ref.outputs.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Write .env.selfhost
        env:
          ENV_SELFHOST: ${{ secrets.ENV_SELFHOST }}
        run: printf '%s\n' "$ENV_SELFHOST" > .env.selfhost

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:selfhost --yes
